<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AQI Prediction and Health Advisory System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AQI Prediction and Health Advisory System</h1>

        <p>Enter the air pollution details to predict the AQI.</p>

        <form action="/predict" method="POST">

            <label>City</label>
            <select name="city" required>
                <option value="">Select City</option>
                {% for c in cities %}
                <option value="{{ c }}" {% if c == selected_city %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>


            <label>PM2.5 (µg/m³)</label>
            <input type="number" step="any" min="0" name="pm25" required>


            <label>PM10 (µg/m³)</label>
            <input type="number" step="any" min="0" name="pm10" required>


            <label>NO2 (µg/m³)</label>
            <input type="number" step="any" min="0" name="no2" required>


            <label>SO2 (µg/m³)</label>
            <input type="number" step="any" min="0" name="so2" required>


            <label>CO (mg/m³)</label>
            <input type="number" step="any" min="0" name="co" required>


            <label>O3 (µg/m³)</label>
            <input type="number" step="any" min="0" name="o3" required>


            <button type="submit">Predict AQI</button>

        </form>


        {% if error is defined %}
        <div class="result">
            <p>{{ error }}</p>
        </div>
        {% endif %}


        {% if prediction is defined %}
        <div class="result">

            <h2>Predicted AQI</h2>

            <h3>{{ prediction }} ({{ category }})</h3>

            <p>{{ recommendation }}</p>

        </div>
        {% endif %}

    </div>

</body>
</html>
